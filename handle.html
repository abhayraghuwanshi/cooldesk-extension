<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoolDesk Handle</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent !important;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
        }

        /* One grabber design for every edge: a slim translucent dark tab flush
           to the screen edge, with a thin grip line running along it. The side
           class (left/top/bottom; right is the default) sets which corners are
           rounded and the grip's orientation. */
        #handle {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            background: rgba(22, 18, 30, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-right: none;
            border-radius: 10px 0 0 10px;
            box-shadow: -2px 0 12px rgba(0, 0, 0, 0.4);
            transition: background 0.15s ease, transform 0.15s ease;
        }

        #handle.left {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-left: none;
            border-radius: 0 10px 10px 0;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.4);
        }

        #handle.top {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-top: none;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        }

        #handle.bottom {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.4);
        }

        /* Hover: gentle lift — slightly lighter tab, grip line turns purple. */
        #handle:hover {
            background: rgba(42, 34, 56, 0.92);
        }

        #handle:hover .grip {
            background: #a78bfa;
            opacity: 1;
        }

        #handle:active {
            transform: scale(0.97);
        }

        /* The grip: one thin line along the edge. Vertical by default (right/
           left edges); top/bottom rotate it horizontal. */
        .grip {
            width: 3px;
            height: 28px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.55);
            opacity: 0.85;
            transition: background 0.15s ease, opacity 0.15s ease;
        }

        #handle.top .grip,
        #handle.bottom .grip {
            width: 28px;
            height: 3px;
        }

        .grip span {
            display: none;
        }

        /* Orientation safety net from the window's own shape: the handle window
           is wider than tall only when docked top/bottom (132×22 vs 22×132), so
           this can't go stale the way the side class from dock state can.
           Defaults to the bottom-edge look; the .top class still overrides. */
        @media (min-aspect-ratio: 1/1) {
            #handle {
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-bottom: none;
                border-radius: 10px 10px 0 0;
                box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.4);
            }

            .grip {
                width: 28px;
                height: 3px;
            }
        }
    </style>
</head>

<body>
    <div id="handle" title="Open CoolDesk">
        <div class="grip">
            <span></span><span></span><span></span>
        </div>
    </div>
    <script type="module" src="/src/handle-main.js"></script>
</body>

</html>
