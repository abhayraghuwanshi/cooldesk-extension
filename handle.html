<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoolDesk Handle</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent !important;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
        }

        /* One grabber for every edge: just a slim floating pill, like the iOS
           home indicator — no tab/box behind it, so it doesn't compete with
           whatever app sits at that screen edge. The pill runs along the edge
           (horizontal for top/bottom, vertical for left/right) and grows +
           takes the accent color on hover.

           The window is transparent; #handle keeps a near-invisible fill
           (alpha 0.01) so the whole 132×22 strip still receives clicks —
           macOS passes clicks on fully transparent pixels through to the
           window underneath. Hover-to-open is polled from Rust, so it
           doesn't depend on this. */
        #handle {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.01);
        }

        /* Vertical by default (right/left edges); top/bottom and the aspect
           ratio safety net below rotate it horizontal. The dark halo keeps it
           visible over light content without a box behind it. */
        .grip {
            width: 5px;
            height: 44px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.42);
            box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.35), 0 1px 4px rgba(0, 0, 0, 0.35);
            transition: width 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.18s ease;
        }

        #handle.top .grip,
        #handle.bottom .grip {
            width: 44px;
            height: 5px;
        }

        #handle:hover .grip {
            height: 64px;
            background: #a78bfa;
        }

        #handle.top:hover .grip,
        #handle.bottom:hover .grip {
            width: 64px;
            height: 5px;
        }

        #handle:active .grip {
            opacity: 0.8;
        }

        .grip span {
            display: none;
        }

        /* Orientation safety net from the window's own shape: the handle window
           is wider than tall only when docked top/bottom (132×22 vs 22×132), so
           this can't go stale the way the side class from dock state can. */
        @media (min-aspect-ratio: 1/1) {
            .grip {
                width: 44px;
                height: 5px;
            }

            #handle:hover .grip {
                width: 64px;
                height: 5px;
            }
        }
    </style>
</head>

<body>
    <div id="handle" title="Open CoolDesk">
        <div class="grip">
            <span></span><span></span><span></span>
        </div>
    </div>
    <script type="module" src="/src/app/handle-main.js"></script>
</body>

</html>
