<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Generator — CoolDesk Widget</title>
<link rel="stylesheet" href="base.css?v=4">
<script src="cooldesk.js?v=4"></script>
<link rel="icon" href="/favicon.ico"></head>
<body>
<main class="widget" style="justify-content:center;gap:10px">
  <div class="row spread">
    <span class="label">Password generator</span>
    <span class="label mono" id="lenLabel">16</span>
  </div>
  <div class="card mono" id="output" style="font-size:15px;word-break:break-all;cursor:pointer" title="Click to copy"></div>
  <input type="range" id="len" min="8" max="40" value="16" style="accent-color:var(--accent);padding:0;border:0;background:transparent">
  <div class="row" style="font-size:11px;gap:12px">
    <label class="row" style="gap:4px"><input type="checkbox" id="digits" checked style="width:13px;height:13px;accent-color:var(--accent)"> 0-9</label>
    <label class="row" style="gap:4px"><input type="checkbox" id="symbols" checked style="width:13px;height:13px;accent-color:var(--accent)"> !@#</label>
    <span class="grow"></span>
    <button id="gen">New</button>
    <button class="primary" id="copy">Copy</button>
  </div>
</main>
<script src="password.js?v=5"></script>
</body>
</html>
