<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Year in Dots — CoolDesk Widget</title>
<link rel="stylesheet" href="base.css?v=10">
<style>
  /* 53 week-columns must fit any card width: columns share the width
     (minmax(0, 1fr)) instead of each insisting on a minimum, which overflowed. */
  .dots { display: grid; grid-template-rows: repeat(7, auto); grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; flex: 1; align-content: center; min-width: 0; }
  .d { width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--faint); }
  .d.past { background: color-mix(in srgb, var(--accent) 62%, transparent); }
  .d.today { background: var(--fg); box-shadow: 0 0 6px var(--fg); }
</style>
<script src="cooldesk.js?v=8"></script>
<link rel="icon" href="/favicon.ico"></head>
<body>
<main class="widget">
  <div class="row spread">
    <span class="label" id="title"></span>
    <span class="label mono" id="count"></span>
  </div>
  <div class="dots" id="dots"></div>
</main>
<script src="year-dots.js?v=5"></script>
</body>
</html>
