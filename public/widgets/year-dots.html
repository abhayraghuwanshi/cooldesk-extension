<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Year in Dots — CoolDesk Widget</title>
<link rel="stylesheet" href="base.css?v=4">
<style>
  .dots { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; flex: 1; align-content: center; }
  .d { width: 100%; aspect-ratio: 1; border-radius: 2px; background: var(--faint); min-width: 3px; }
  .d.past { background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .d.today { background: var(--fg); }
</style>
<script src="cooldesk.js?v=4"></script>
<link rel="icon" href="/favicon.ico"></head>
<body>
<main class="widget">
  <div class="row spread">
    <span class="label" id="title"></span>
    <span class="label mono" id="count"></span>
  </div>
  <div class="dots" id="dots"></div>
</main>
<script src="year-dots.js?v=5"></script>
</body>
</html>
