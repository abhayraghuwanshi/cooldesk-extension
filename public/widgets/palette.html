<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Palette — CoolDesk Widget</title>
<link rel="stylesheet" href="base.css?v=11">
<style>
  .swatches { display: flex; flex: 1; gap: 6px; min-height: 0; }
  .swatch { flex: 1; min-width: 0; border-radius: 12px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 7px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); transition: transform .15s; }
  .swatch:hover { transform: translateY(-3px); }
  .swatch span { max-width: calc(100% - 6px); overflow: hidden; font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: .02em; background: rgba(0,0,0,.42); color: #fff; padding: 2px 4px; border-radius: 5px; }
  #gen { flex: none; }
</style>
<script src="cooldesk.js?v=8"></script>
<link rel="icon" href="/favicon.ico"></head>
<body>
<main class="widget">
  <div class="row spread">
    <span class="label" id="status">Palette · click to copy</span>
    <button id="gen">Shuffle</button>
  </div>
  <div class="swatches" id="swatches"></div>
</main>
<script src="palette.js?v=6"></script>
</body>
</html>
