<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Links — CoolDesk Widget</title>
<link rel="stylesheet" href="base.css?v=12">
<script src="cooldesk.js?v=9"></script>
<style>
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 4px 8px; border-radius: 12px; transition: background-color .15s; }
  .tile:hover { background: var(--card); }
  .glyph { width: 38px; height: 38px; border-radius: 11px; background: var(--card); box-shadow: inset 0 0 0 1px var(--faint); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; color: var(--accent); transition: transform .15s; }
  .tile:hover .glyph { transform: translateY(-2px); }
  .glyph img { width: 22px; height: 22px; border-radius: 5px; }
  .tile span { font-size: 11px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile button { position: absolute; top: 2px; right: 2px; padding: 0 5px; border: none; opacity: 0; }
  .tile:hover button { opacity: 1; }
</style>
<link rel="icon" href="/favicon.ico"></head>
<body>
<main class="widget">
  <div class="row spread">
    <span class="label">Quick links</span>
    <button class="ghost" id="add">+ Add</button>
  </div>
  <form class="row" id="form" style="display:none">
    <input id="name" placeholder="Name" style="width:80px" maxlength="20">
    <input class="grow" id="url" placeholder="https://…" type="url" required>
    <button class="primary">Save</button>
  </form>
  <div class="grid" id="grid"></div>
</main>
<script src="i18n.js?v=3"></script>
<script src="quick-links.js?v=6"></script>
</body>
</html>
