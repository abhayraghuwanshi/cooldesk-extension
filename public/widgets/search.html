<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search — CoolDesk Widget</title>
<link rel="stylesheet" href="base.css?v=9">
<script src="cooldesk.js?v=7"></script>
<link rel="icon" href="/favicon.ico"></head>
<body>
<style>
  .searchbar { display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--faint); transition: border-color .15s, box-shadow .15s; }
  .searchbar:focus-within { border-color: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .searchbar select, .searchbar input, .searchbar select:focus, .searchbar input:focus { border: 0; background: transparent; box-shadow: none; }
  .searchbar select { flex: none; padding: 6px 4px 6px 12px; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
  .searchbar input { padding: 6px 8px; }
  .searchbar button { flex: none; border-radius: 999px; }
</style>
<main class="widget" style="justify-content:center">
  <form class="searchbar" id="form">
    <select id="engine" aria-label="Search engine">
      <option value="https://www.google.com/search?q=">Google</option>
      <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
      <option value="https://www.bing.com/search?q=">Bing</option>
      <option value="https://www.youtube.com/results?search_query=">YouTube</option>
      <option value="https://github.com/search?q=">GitHub</option>
    </select>
    <input class="grow" id="q" placeholder="Search the web…" autocomplete="off" aria-label="Search">
    <button class="primary">Go</button>
  </form>
</main>
<script src="search.js?v=5"></script>
</body>
</html>
