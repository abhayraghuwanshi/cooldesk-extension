<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breathe — CoolDesk Widget</title>
<link rel="stylesheet" href="base.css?v=4">
<style>
  .orb {
    width: 90px; height: 90px; border-radius: 50%;
    border: 2px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    transition: transform 3.8s ease-in-out;
    transform: scale(0.6);
  }
  .orb.in { transform: scale(1); }
</style>
<script src="cooldesk.js?v=4"></script>
<link rel="icon" href="/favicon.ico"></head>
<body>
<main class="widget" style="align-items:center;justify-content:center;gap:14px">
  <div class="orb" id="orb"></div>
  <span class="label" id="phase">Box breathing · 4-4-4-4</span>
  <button id="toggle">Start</button>
</main>
<script src="breathe.js?v=5"></script>
</body>
</html>
