<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water Tracker — CoolDesk Widget</title>
<link rel="stylesheet" href="base.css?v=10">
<style>
  .glasses { display: flex; gap: 6px; align-items: flex-end; }
  .glass {
    position: relative; flex: 1; max-width: 26px; aspect-ratio: 3 / 4; overflow: hidden;
    border: 1.5px solid color-mix(in srgb, var(--fg) 28%, transparent); border-top-color: transparent;
    border-radius: 3px 3px 8px 8px;
    clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%);
    background: color-mix(in srgb, var(--fg) 9%, transparent);
  }
  .glass::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    background: linear-gradient(#8ad6ff, #3b8cff);
    transition: height .45s cubic-bezier(.3, 1.3, .5, 1);
  }
  .glass.full::after { height: 76%; }
  .glass.full { border-color: rgba(122, 196, 255, .55); border-top-color: transparent; }
</style>
<script src="cooldesk.js?v=8"></script>
<link rel="icon" href="/favicon.ico"></head>
<body>
<main class="widget" style="justify-content:center;gap:12px">
  <div class="row spread">
    <span class="label">Water</span>
    <span class="label" id="count"></span>
  </div>
  <div class="glasses" id="glasses"></div>
  <div class="row">
    <button class="primary grow" id="add">+ Add a glass</button>
    <button class="ghost" id="minus">−</button>
  </div>
</main>
<script src="water.js?v=5"></script>
</body>
</html>
