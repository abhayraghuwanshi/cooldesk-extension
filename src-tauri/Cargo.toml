[package]
name = "cooldesk"
version = "2.0.8"
description = "AI-powered desktop workspace manager"
authors = ["CoolDesk"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "cooldesk"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
llm = []

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `devtools` is deliberately on for release builds as well: without it the
# packaged app has no console, so console-only failures (CSP violations in
# particular) are invisible in exactly the build where they occur.
tauri = { version = "2.10.0", features = ["macos-private-api", "tray-icon", "devtools"] }
tauri-plugin-log = "2"

sysinfo = "0.30"
tauri-plugin-global-shortcut = "2"

# Sidecar server dependencies
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
chrono = "0.4"
url = "2"
rand = "0.8"

dirs = "5.0"
reqwest = { version = "0.12", features = ["stream", "json"] }
rig-core = "0.9"
tokio-util = { version = "0.7", features = ["compat"] }
async-stream = "0.3"
tracing = "0.1"
lazy_static = "1.5.0"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
encoding_rs = "0.8.35"
async-trait = "0.1"
urlencoding = "2.1"
open = "5"
semver = "1"

# Feedback/RL dependencies
uuid = { version = "1.0", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3.10"


[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
# Already resolved transitively at this version via core-graphics — declaring
# it directly doesn't add to the dependency tree. Needed for CFArray/CFNumber
# wrappers around the private CGS Spaces calls in `dock::mac` (see the
# `cgs` submodule) that make windows join another app's fullscreen Space.
core-foundation = "0.9"
# Pinned to the exact version tao/wry already resolve, so this doesn't
# duplicate the dependency tree — just gives us typed access to NSWindow
# APIs (collection behavior) that Tauri doesn't expose itself.
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWindow", "NSResponder"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
    "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Com_StructuredStorage",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints"
] }
