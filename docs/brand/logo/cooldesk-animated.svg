<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>CoolDesk</title>
  <!--
    Animated CoolDesk mark. Pure SVG + CSS, no script.
    Intro (~1.6s): badge pops in → lobes spread apart → core ring appears →
    signal arcs draw outward. Then an idle loop: a pulse ripples out through
    the arcs every 2.4s. Respects prefers-reduced-motion (shows the still mark).
    The ring and arcs are knock-outs (a mask), so the badge colour shows
    through them — animating the mask is what makes them draw and pulse.
  -->
  <style>
    .badge, .lobes, .ring, .arc { transform-box: fill-box; transform-origin: center; }

    .badge { animation: cd-pop 600ms cubic-bezier(.2, .9, .3, 1.25) both; }
    .lobes { animation: cd-spread 700ms 150ms cubic-bezier(.2, .9, .25, 1.15) both; }
    .ring  { animation: cd-ring 450ms 500ms cubic-bezier(.2, .9, .3, 1.4) both,
                        cd-beat 2400ms 1800ms ease-in-out infinite; }
    .arc   { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .a1 { animation: cd-draw 420ms 700ms ease-out forwards, cd-pulse 2400ms 1800ms ease-in-out infinite; }
    .a2 { animation: cd-draw 420ms 820ms ease-out forwards, cd-pulse 2400ms 1950ms ease-in-out infinite; }
    .a3 { animation: cd-draw 420ms 940ms ease-out forwards, cd-pulse 2400ms 2100ms ease-in-out infinite; }

    @keyframes cd-pop    { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes cd-spread { from { transform: scale(.25, .55); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes cd-ring   { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes cd-draw   { to { stroke-dashoffset: 0; } }
    /* Arc "lights off" briefly (cut-out fills back in), staggered per arc = a wave moving outward. */
    @keyframes cd-pulse  { 0%, 55%, 100% { opacity: 1; } 22% { opacity: .2; } }
    @keyframes cd-beat   { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } }

    @media (prefers-reduced-motion: reduce) {
      .badge, .lobes, .ring, .arc { animation: none !important; }
      .arc { stroke-dashoffset: 0; }
    }
  </style>
  <defs>
    <linearGradient id="cd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#4B32D6"/>
    </linearGradient>
    <mask id="cd-knockout" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="11" stroke-linecap="round">
        <circle class="ring" cx="256" cy="256" r="19"/>
        <path class="arc a1" pathLength="1" d="M294.83 227.79 A48 48 0 0 1 294.83 284.21"/>
        <path class="arc a1" pathLength="1" d="M217.17 227.79 A48 48 0 0 0 217.17 284.21"/>
        <path class="arc a2" pathLength="1" d="M314.25 213.68 A72 72 0 0 1 314.25 298.32"/>
        <path class="arc a2" pathLength="1" d="M197.75 213.68 A72 72 0 0 0 197.75 298.32"/>
        <path class="arc a3" pathLength="1" d="M333.66 199.57 A96 96 0 0 1 333.66 312.43"/>
        <path class="arc a3" pathLength="1" d="M178.34 199.57 A96 96 0 0 0 178.34 312.43"/>
      </g>
    </mask>
  </defs>
  <circle class="badge" cx="256" cy="256" r="232" fill="url(#cd-bg)"/>
  <g transform="translate(256 256) scale(1.12) translate(-256 -256)">
    <g class="lobes">
      <path fill="#FFFFFF" mask="url(#cd-knockout)" d="M249.26 195.42 A10 10 0 0 0 262.74 195.42 A82 82 0 1 1 262.74 316.58 A10 10 0 0 0 249.26 316.58 A82 82 0 1 1 249.26 195.42 Z"/>
    </g>
  </g>
</svg>
